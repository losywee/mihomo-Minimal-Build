name: Build Minimal Mihomo

on:
  schedule:
    # Run every hour to check for new upstream stable releases
    - cron: '0 0 */2 * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream Mihomo Tag (e.g., v1.19.34 or latest)'
        required: true
        default: 'latest'
      upx:
        description: 'Enable UPX compression'
        type: boolean
        required: true
        default: true
      force_build:
        description: 'Force build even if release already exists'
        type: boolean
        required: true
        default: false
  push:
    paths:
      - '.github/workflows/**'
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-ver.outputs.version }}
      build_needed: ${{ steps.get-ver.outputs.build_needed }}
    steps:
      - name: Check for New Stable Release
        id: get-ver
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          FORCE="${{ github.event.inputs.force_build }}"

          if [ -z "$INPUT_VER" ] || [ "$INPUT_VER" = "latest" ]; then
            # Query GitHub API for the latest stable release (automatically excludes pre-releases and drafts)
            UPSTREAM_TAG=$(curl -sL \
              -H "User-Agent: GitHub-Action" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.tag_name // empty')

            # Fallback filter from releases list if /releases/latest endpoint is uncached
            if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
              UPSTREAM_TAG=$(curl -sL \
                -H "User-Agent: GitHub-Action" \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/MetaCubeX/mihomo/releases?per_page=10 | \
                jq -r 'first(.[] | select(.prerelease == false and .draft == false)) | .tag_name // empty')
            fi
          else
            UPSTREAM_TAG="$INPUT_VER"
          fi

          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "::error::Failed to retrieve a valid upstream release tag."
            exit 1
          fi

          echo "Latest upstream stable release: $UPSTREAM_TAG"
          echo "version=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

          # Check if this release already exists in current repository
          CURRENT_RELEASE=$(curl -sL \
            -H "User-Agent: GitHub-Action" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${UPSTREAM_TAG}" | jq -r '.tag_name // empty')

          if [ "$CURRENT_RELEASE" = "$UPSTREAM_TAG" ] && [ "$FORCE" != "true" ]; then
            echo "Release $UPSTREAM_TAG already exists in this repository. No build required."
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New stable release detected or rebuild requested ($UPSTREAM_TAG). Proceeding to build."
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux ARM (Embedded Routers & SBCs)
          - { goos: linux, goarch: arm64, name: linux-arm64 }
          - { goos: linux, goarch: arm, goarm: '7', name: linux-armv7 }
          - { goos: linux, goarch: arm, goarm: '6', name: linux-armv6 }
          - { goos: linux, goarch: arm, goarm: '5', name: linux-armv5 }
          # Linux MIPS / MIPSEL (OpenWrt routers)
          - { goos: linux, goarch: mipsle, gomips: softfloat, name: linux-mipsle-softfloat }
          - { goos: linux, goarch: mipsle, gomips: hardfloat, name: linux-mipsle-hardfloat }
          - { goos: linux, goarch: mips, gomips: softfloat, name: linux-mips-softfloat }
          - { goos: linux, goarch: mips, gomips: hardfloat, name: linux-mips-hardfloat }
          # Linux x86 / x86_64
          - { goos: linux, goarch: amd64, name: linux-amd64 }
          - { goos: linux, goarch: '386', name: linux-386 }
          # Linux RISC-V & LoongArch
          - { goos: linux, goarch: riscv64, name: linux-riscv64 }
          - { goos: linux, goarch: loong64, name: linux-loong64 }
          # macOS (Darwin)
          - { goos: darwin, goarch: arm64, name: darwin-arm64 }
          - { goos: darwin, goarch: amd64, name: darwin-amd64 }
          # Windows
          - { goos: windows, goarch: amd64, name: windows-amd64 }
          - { goos: windows, goarch: arm64, name: windows-arm64 }
          - { goos: windows, goarch: '386', name: windows-386 }
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Install UPX and Zip
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.upx != 'false' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl zip

      - name: Checkout MetaCubeX/mihomo
        uses: actions/checkout@v4
        with:
          repository: MetaCubeX/mihomo
          ref: ${{ needs.check-version.outputs.version }}
          path: mihomo

      - name: Compile Minimal Binary
        working-directory: mihomo
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          BUILDTIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          OUTPUT="mihomo-${{ matrix.name }}"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN_NAME="${OUTPUT}.exe"
          else
            BIN_NAME="${OUTPUT}"
          fi

          go build -v -trimpath \
            -tags "no_easytier,no_zerotier,no_tailscale,no_fake_tcp,with_low_memory" \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' \
                     -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' \
                     -s -w -buildid=" \
            -o "$BIN_NAME"

          # UPX compression (gracefully falls back if unsupported by platform/arch)
          if [ "${{ github.event_name != 'workflow_dispatch' || github.event.inputs.upx != 'false' }}" = "true" ]; then
            echo "Attempting UPX compression on $BIN_NAME..."
            upx --lzma "$BIN_NAME" || upx -9 "$BIN_NAME" || echo "UPX compression skipped for $BIN_NAME"
          fi

          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "dist/${OUTPUT}.zip" "$BIN_NAME"
          else
            tar -czvf "dist/${OUTPUT}.tar.gz" "$BIN_NAME"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-${{ matrix.name }}
          path: |
            mihomo/dist/*.tar.gz
            mihomo/dist/*.zip

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} + > sha256sums.txt
          cat sha256sums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: Mihomo Minimal ${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
          body: |
            ### Mihomo Minimal Build (${{ needs.check-version.outputs.version }})

            Automated resource-constrained minimal builds for Linux, macOS, and Windows.

            #### Platforms Included:
            - **Linux**: arm64, armv7, armv6, armv5, mipsle (soft/hard), mips (soft/hard), amd64, 386, riscv64, loong64
            - **macOS**: Apple Silicon (`darwin-arm64`), Intel (`darwin-amd64`)
            - **Windows**: x64 (`windows-amd64`), ARM64 (`windows-arm64`), x86 (`windows-386`)

            #### Optimizations Applied:
            - **Stripped Heavy Outbound Protocols**: `-tags "no_easytier,no_zerotier,no_tailscale"`
            - **Excluded gVisor Userland Stack**: Omitted `with_gvisor` (relies on lightweight `mips` or kernel `system` stack)
            - **Stripped FakeTCP**: `-tags "no_fake_tcp"`
            - **Low-Memory Relay Buffers**: `-tags "with_low_memory"` (16 KiB TCP / 8 KiB UDP buffer pools)
            - **Stripped Debug Symbols**: `-ldflags "-s -w -buildid="`
            - **UPX LZMA Compressed** on supported platforms
